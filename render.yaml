# Render settings for the backend (server/). See DEPLOY.md.
# Values marked sync: false are typed in on the Render website, never saved here.
services:
  - type: web
    name: merosadak-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Vercel + Render = 2 proxies in front of the app
      - key: TRUST_PROXY
        value: "2"
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      # Cloud Run service URL + /classify, e.g. https://merosadak-classifier-xxxx.europe-north1.run.app/classify
      - key: CLASSIFIER_URL
        sync: false
      # how long to wait for the classifier, long enough for Cloud Run to wake up
      - key: CLASSIFIER_TIMEOUT_MS
        value: "60000"
      # your Vercel URL, e.g. https://merosadak.vercel.app
      - key: CLIENT_ORIGIN
        sync: false
      # Gmail API, because the free plan blocks SMTP (DEPLOY.md, step 2b)
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      # e.g. MeroSadak <you@gmail.com>, must be the Gmail account you signed in with
      - key: MAIL_FROM
        sync: false
